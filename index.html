<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銅管樂團學生資料查詢系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS CDN (讀取 Excel 檔案) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen pb-12">

    <!-- 頂部標題列 -->
    <header class="bg-indigo-700 text-white shadow-md py-6 px-4 mb-6">
        <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-wide">🎺 銅管樂學生資料查詢系統</h1>
                <p class="text-indigo-200 text-sm mt-1">專為老師設計之各樂器組別與樂團名單快速檢索 App</p>
            </div>
            <div id="statusBadge" class="bg-indigo-800 text-indigo-200 px-3 py-1.5 rounded-full text-xs font-medium border border-indigo-600">
                ⚠️ 請先載入 Excel 資料檔
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 space-y-6">

        <!-- 檔案上載區 -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-700 mb-3 flex items-center gap-2">
                📂 載入 Excel 名單檔案
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="border-2 border-dashed border-indigo-200 hover:border-indigo-400 bg-indigo-50/50 p-4 rounded-lg text-center transition">
                    <label class="block cursor-pointer">
                        <span class="block text-sm font-semibold text-indigo-900 mb-1">1. 選擇《銅管樂各組樂器學生名單》</span>
                        <span class="block text-xs text-slate-500 mb-2">支援包含各分頁之 .xlsx 檔案</span>
                        <input type="file" id="instrumentsFile" accept=".xlsx, .xls" class="block w-full text-xs text-slate-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer" />
                    </label>
                </div>
                <div class="border-2 border-dashed border-emerald-200 hover:border-emerald-400 bg-emerald-50/50 p-4 rounded-lg text-center transition">
                    <label class="block cursor-pointer">
                        <span class="block text-sm font-semibold text-emerald-900 mb-1">2. 選擇《銅管樂團學生名單》</span>
                        <span class="block text-xs text-slate-500 mb-2">包含 Ensemble 1 及 Ensemble 2</span>
                        <input type="file" id="ensembleFile" accept=".xlsx, .xls" class="block w-full text-xs text-slate-500 file:mr-4 file:py-1.5 file:px-3 file:rounded-md file:border-0 file:text-xs file:font-semibold file:bg-emerald-600 file:text-white hover:file:bg-emerald-700 cursor-pointer" />
                    </label>
                </div>
            </div>
        </section>

        <!-- 查詢頁籤與搜尋列 -->
        <section class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
            <!-- 模式頁籤 -->
            <div class="flex border-b border-slate-200 bg-slate-100">
                <button id="tabGroup" onclick="switchTab('group')" class="flex-1 py-3 px-4 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 bg-white transition">
                    🥁 依樂器 / 樂團組別檢視
                </button>
                <button id="tabStudent" onclick="switchTab('student')" class="flex-1 py-3 px-4 font-bold text-center text-slate-500 hover:text-slate-700 transition">
                    🔍 依學生個人搜尋（班別/學號/姓名）
                </button>
            </div>

            <!-- 篩選控制面板 -->
            <div class="p-6 bg-slate-50/50 border-b border-slate-200">
                <!-- 樂器組別選單 (模式一) -->
                <div id="groupFilterView" class="flex flex-col md:flex-row items-center gap-4">
                    <label class="font-semibold text-slate-700 whitespace-nowrap">選擇樂器/樂團分頁：</label>
                    <select id="groupSelect" onchange="filterByGroup()" class="w-full md:w-80 bg-white border border-slate-300 rounded-lg px-3 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="">-- 請先上載 Excel 檔案 --</option>
                    </select>
                </div>

                <!-- 學生搜尋列 (模式二) -->
                <div id="studentSearchView" class="hidden flex-col md:flex-row items-center gap-4">
                    <label class="font-semibold text-slate-700 whitespace-nowrap">搜尋學生關鍵字：</label>
                    <input type="text" id="searchInput" oninput="searchStudent()" placeholder="輸入學生姓名、班別 (如 3A) 或學號..." class="w-full md:w-96 bg-white border border-slate-300 rounded-lg px-4 py-2 text-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                    <span class="text-xs text-slate-500">（支援同時搜尋多名或跨組別紀錄）</span>
                </div>
            </div>

            <!-- 資料列表 -->
            <div class="p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 id="resultTitle" class="font-bold text-lg text-slate-800">查詢結果</h3>
                    <span id="resultCount" class="text-xs font-semibold bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">共 0 筆紀錄</span>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-slate-100 text-slate-600 border-b border-slate-200">
                                <th class="p-3 font-semibold">組別/分頁</th>
                                <th class="p-3 font-semibold">班別</th>
                                <th class="p-3 font-semibold">學號</th>
                                <th class="p-3 font-semibold">姓名</th>
                                <th class="p-3 font-semibold">活動</th>
                                <th class="p-3 font-semibold">星期</th>
                                <th class="p-3 font-semibold">時間</th>
                                <th class="p-3 font-semibold">活動後放學方式</th>
                            </tr>
                        </thead>
                        <tbody id="dataTableBody" class="divide-y divide-slate-100">
                            <tr>
                                <td colspan="8" class="text-center py-8 text-slate-400">請在上載檔案後查看資料</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <!-- JavaScript 邏輯處理 -->
    <script>
        let allStudentsData = []; // 儲存所有整理後的學生資料
        let currentMode = 'group'; // 'group' 或 'student'

        // 綁定檔案上載監聽
        document.getElementById('instrumentsFile').addEventListener('change', handleFiles);
        document.getElementById('ensembleFile').addEventListener('change', handleFiles);

        async function handleFiles() {
            const instFile = document.getElementById('instrumentsFile').files[0];
            const ensFile = document.getElementById('ensembleFile').files[0];

            allStudentsData = [];

            if (instFile) await processExcel(instFile, 'instrument');
            if (ensFile) await processExcel(ensFile, 'ensemble');

            updateGroupDropdown();
            updateStatus();
            refreshView();
        }

        // 解析 Excel 內容
        function processExcel(file, type) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    workbook.SheetNames.forEach(sheetName => {
                        const worksheet = workbook.Sheets[sheetName];
                        const json = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                        json.forEach(row => {
                            // 欄位標題容錯邏輯
                            const rawClass = row['班別'] || row['Class'] || '';
                            const rawNo = row['學號'] || row['No'] || row['No.'] || '';
                            const rawName = row['姓名'] || row['Name'] || '';
                            let activity = row['活動'] || row['Activity'] || sheetName;
                            const day = row['星期'] || row['Day'] || '星期五';
                            let time = row['時間'] || row['Time'] || '';
                            const dismissal = row['活動後放學方式'] || row['放學方式'] || row['Dismissal'] || '';

                            if (!rawName && !rawClass) return; // 跳過空行

                            // 處理 Ensemble 1 & 2 時間與活動名稱邏輯
                            let groupDisplayName = sheetName;
                            if (type === 'ensemble') {
                                if (sheetName.includes('Ensemble 1') || time.includes('14:25') || time.includes('2:25')) {
                                    groupDisplayName = 'Ensemble 1';
                                    activity = 'Ensemble 1';
                                    time = '下午 2:25 - 3:25';
                                } else if (sheetName.includes('Ensemble 2') || time.includes('15:25') || time.includes('3:25')) {
                                    groupDisplayName = 'Ensemble 2';
                                    activity = 'Ensemble 2';
                                    time = '下午 3:25 - 4:25';
                                }
                            }

                            allStudentsData.push({
                                groupName: groupDisplayName,
                                class: String(rawClass).trim(),
                                studentNo: String(rawNo).trim(),
                                name: String(rawName).trim(),
                                activity: String(activity).trim(),
                                day: String(day).trim(),
                                time: String(time).trim(),
                                dismissal: String(dismissal).trim()
                            });
                        });
                    });
                    resolve();
                };
                reader.readAsArrayBuffer(file);
            });
        }

        // 更新組別下拉選單
        function updateGroupDropdown() {
            const select = document.getElementById('groupSelect');
            select.innerHTML = '<option value="">-- 請選擇樂器/樂團組別 --</option>';

            const groups = [...new Set(allStudentsData.map(item => item.groupName))];
            groups.forEach(g => {
                const opt = document.createElement('option');
                opt.value = g;
                opt.textContent = g;
                select.appendChild(opt);
            });

            if (groups.length > 0) select.selectedIndex = 1;
        }

        // 更新狀態提示
        function updateStatus() {
            const badge = document.getElementById('statusBadge');
            if (allStudentsData.length > 0) {
                badge.className = "bg-emerald-800 text-emerald-200 px-3 py-1.5 rounded-full text-xs font-medium border border-emerald-600";
                badge.innerHTML = `✅ 已成功載入 ${allStudentsData.length} 筆學生紀錄`;
            }
        }

        // 切換分頁模式
        function switchTab(mode) {
            currentMode = mode;
            const tabGroup = document.getElementById('tabGroup');
            const tabStudent = document.getElementById('tabStudent');
            const groupFilterView = document.getElementById('groupFilterView');
            const studentSearchView = document.getElementById('studentSearchView');

            if (mode === 'group') {
                tabGroup.className = "flex-1 py-3 px-4 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 bg-white transition";
                tabStudent.className = "flex-1 py-3 px-4 font-bold text-center text-slate-500 hover:text-slate-700 transition";
                groupFilterView.classList.remove('hidden');
                groupFilterView.classList.add('flex');
                studentSearchView.classList.remove('flex');
                studentSearchView.classList.add('hidden');
                filterByGroup();
            } else {
                tabStudent.className = "flex-1 py-3 px-4 font-bold text-center border-b-2 border-indigo-600 text-indigo-600 bg-white transition";
                tabGroup.className = "flex-1 py-3 px-4 font-bold text-center text-slate-500 hover:text-slate-700 transition";
                studentSearchView.classList.remove('hidden');
                studentSearchView.classList.add('flex');
                groupFilterView.classList.remove('flex');
                groupFilterView.classList.add('hidden');
                searchStudent();
            }
        }

        // 依組別篩選
        function filterByGroup() {
            const selectedGroup = document.getElementById('groupSelect').value;
            const filtered = allStudentsData.filter(item => item.groupName === selectedGroup);
            renderTable(filtered, `組別：${selectedGroup || '未選擇'}`);
        }

        // 依學生關鍵字搜尋
        function searchStudent() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                renderTable([], '學生個人搜尋');
                return;
            }

            const filtered = allStudentsData.filter(item => 
                item.name.toLowerCase().includes(query) ||
                item.class.toLowerCase().includes(query) ||
                item.studentNo.toLowerCase().includes(query)
            );
            renderTable(filtered, `搜尋關鍵字：「${query}」`);
        }

        // 重新整理目前視圖
        function refreshView() {
            if (currentMode === 'group') filterByGroup();
            else searchStudent();
        }

        // 渲染表格
        function renderTable(data, contextTitle) {
            const tbody = document.getElementById('dataTableBody');
            const countLabel = document.getElementById('resultCount');
            const titleLabel = document.getElementById('resultTitle');

            titleLabel.textContent = contextTitle;
            countLabel.textContent = `共 ${data.length} 筆紀錄`;
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center py-8 text-slate-400">沒有找到符合條件的資料</td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-indigo-50/30 transition";

                const isEnsemble = item.groupName.includes('Ensemble');
                const badgeStyle = isEnsemble ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-indigo-100 text-indigo-800 border-indigo-200';

                tr.innerHTML = `
                    <td class="p-3"><span class="px-2 py-0.5 text-xs font-semibold rounded border ${badgeStyle}">${item.groupName}</span></td>
                    <td class="p-3 font-semibold text-slate-700">${item.class}</td>
                    <td class="p-3 text-slate-600">${item.studentNo}</td>
                    <td class="p-3 font-bold text-slate-800">${item.name}</td>
                    <td class="p-3 text-slate-600">${item.activity}</td>
                    <td class="p-3 text-slate-600">${item.day}</td>
                    <td class="p-3 text-slate-600">${item.time}</td>
                    <td class="p-3 text-slate-600">${item.dismissal}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
